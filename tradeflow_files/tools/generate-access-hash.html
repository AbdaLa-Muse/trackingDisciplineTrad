<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeFlow Access Code Hash Generator</title><style>body{font-family:system-ui;background:#0b1020;color:#f4f7fb;max-width:760px;margin:50px auto;padding:20px}div{background:#111827;border:1px solid #223047;border-radius:16px;padding:24px}input,button,textarea{font:inherit}input{width:100%;padding:12px;border-radius:10px;border:1px solid #34425a;background:#151e2f;color:#fff;box-sizing:border-box}button{margin-top:12px;padding:12px 16px;border:0;border-radius:10px;background:#7c8cff;color:white;font-weight:700}pre{white-space:pre-wrap;word-break:break-all;background:#0a0f1c;padding:14px;border-radius:10px;color:#b9c4d6}</style></head><body><div><h1>TradeFlow Access Code Hash Generator</h1><p>This page runs locally in your browser. It does not send the code anywhere.</p><label>4-digit access code</label><input id="code" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*"><button id="go">Generate salt + hash</button><pre id="out">Enter your final 4-digit code.</pre></div><script>
const enc=new TextEncoder();const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');document.getElementById('go').onclick=async()=>{const code=document.getElementById('code').value.trim();if(!/^\d{4}$/.test(code)){document.getElementById('out').textContent='Please enter exactly 4 digits.';return}const salt=crypto.getRandomValues(new Uint8Array(16));const key=await crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:150000},key,256);document.getElementById('out').textContent=`TRADEFLOW_ACCESS_SALT=${hex(salt)}\nTRADEFLOW_ACCESS_HASH=${hex(bits)}`}
</script></body></html>
